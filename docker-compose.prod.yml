services:
  mysql:
    image: ${MYSQL_IMAGE:?set MYSQL_IMAGE}
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    command:
      - mysqld
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u$$MYSQL_USER -p$$MYSQL_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    volumes:
      - type: bind
        source: ${MYSQL_DATA_DIR:-/srv/chatbot-das/mysql}
        target: /var/lib/mysql

  app:
    image: ${APP_IMAGE:?set APP_IMAGE}
    restart: unless-stopped
    env_file:
      - ${APP_ENV_FILE:-/srv/chatbot-das/env/.env.prod}
    environment:
      DATABASE_URL: mysql+pymysql://${MYSQL_USER}:${MYSQL_PASSWORD}@mysql:3306/${MYSQL_DATABASE}?charset=utf8mb4
    depends_on:
      mysql:
        condition: service_healthy
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000"]
    healthcheck:
      test: ["CMD-SHELL", "python - <<'PY'\nfrom sqlalchemy import text\nfrom app.db.session import get_engine\nwith get_engine().connect() as conn:\n    conn.execute(text('SELECT 1'))\nraise SystemExit(0)\nPY"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    volumes:
      - type: bind
        source: ${ATTACHMENTS_HOST_DIR:-/srv/chatbot-das/attachments}
        target: /data/attachments
      - type: bind
        source: ${EXPORTS_HOST_DIR:-/srv/chatbot-das/exports}
        target: /data/exports

  nginx:
    image: ${NGINX_IMAGE:?set NGINX_IMAGE}
    restart: unless-stopped
    depends_on:
      app:
        condition: service_started
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.prod.conf:/etc/nginx/nginx.conf:ro
      - type: bind
        source: ${ATTACHMENTS_HOST_DIR:-/srv/chatbot-das/attachments}
        target: /data/attachments
        read_only: true
      - type: bind
        source: ${EXPORTS_HOST_DIR:-/srv/chatbot-das/exports}
        target: /data/exports
        read_only: true
      - type: bind
        source: ${TLS_CERTS_DIR:-/srv/chatbot-das/certs}
        target: /etc/nginx/certs
        read_only: true
