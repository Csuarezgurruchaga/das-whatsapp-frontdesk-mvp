# Example Codex configuration (safe to commit).
# Copy to `config.toml` and fill in secrets via environment variables or your preferred secret manager.

[mcp_servers.chrome-devtools]
command = "npx"
args = ["chrome-devtools-mcp@latest"]

[mcp_servers.github]
command = "npx"
args = ["-y", "@modelcontextprotocol/server-github"]

[mcp_servers.github.env]
# Do NOT commit real tokens. Prefer exporting this in your shell/profile.
GITHUB_PERSONAL_ACCESS_TOKEN = "${GITHUB_PERSONAL_ACCESS_TOKEN}"

