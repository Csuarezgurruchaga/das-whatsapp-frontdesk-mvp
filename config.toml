model = "gpt-5.3-codex"
model_reasoning_effort = "high"
model_verbosity = "medium"
model_auto_compact_token_limit=1000000000
web_search = "live"
personality = "pragmatic"

[mcp_servers.context7]
command = "bash"
args = ["-lc", 'exec npx -y @upstash/context7-mcp --api-key "$CONTEXT7_API_KEY"']

[mcp_servers.playwright]
command = "npx"
args = ["-y", "@playwright/mcp@latest", "--isolated"]

[mcp_servers.gcloud]
command = "npx"
args = ["-y", "@google-cloud/gcloud-mcp"]

[mcp_servers.observability]
command = "npx"
args = ["-y", "@google-cloud/observability-mcp"]

[mcp_servers.storage]
command = "npx"
args = ["-y", "@google-cloud/storage-mcp"]

[mcp_servers.remotion-documentation]
command = "npx"
args = ["-y", "@remotion/mcp@latest"]

[tui]
notifications = ["complete"]
status_line = ["model-with-reasoning", "git-branch", "context-remaining", "context-window-size", "used-tokens", "total-input-tokens", "total-output-tokens"]


